name: ink_cli
description: ink_cli is a command line interface for ink! smart contracts. Generates code to interact with ink! smart contracts.
version: 0.3.1
homepage: https://github.com/leonardocustodio/polkadart/tree/main/packages/ink_cli
repository: https://github.com/leonardocustodio/polkadart
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.7.0 # BSD-3-Clause
  console: ^4.1.0
  crypto: ^3.0.6 # MIT
  path: ^1.8.3 # BSD-3-Clause
  ink_abi:
    git:
      url: https://github.com/Quantus-Network/polkadart.git
      ref: 0_7_3_quantus_2
      path: packages/ink_abi
  polkadart:
    git:
      url: https://github.com/Quantus-Network/polkadart.git
      ref: 0_7_3_quantus_2
      path: packages/polkadart
  polkadart_keyring:
    git:
      url: https://github.com/Quantus-Network/polkadart.git
      ref: 0_7_3_quantus_2
      path: packages/polkadart_keyring
  polkadart_scale_codec:
    git:
      url: https://github.com/Quantus-Network/polkadart.git
      ref: 0_7_3_quantus_2
      path: packages/polkadart_scale_codec
  ss58:
    git:
      url: https://github.com/Quantus-Network/polkadart.git
      ref: 0_7_3_quantus_2
      path: packages/ss58
  substrate_metadata:
    git:
      url: https://github.com/Quantus-Network/polkadart.git
      ref: 0_7_3_quantus_2
      path: packages/substrate_metadata

dev_dependencies:
  yaml: ^3.1.1 # MIT
  lints: ^6.0.0
  test: ^1.26.3


